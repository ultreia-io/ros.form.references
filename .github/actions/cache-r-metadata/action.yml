name: Cache R dependency metadata
description: Restore the previous pak metadata snapshot without changing pak refresh rules
inputs:
  r-version:
    description: Installed R version
    required: true
runs:
  using: composite
  steps:
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ env.PKG_METADATA_CACHE_DIR }}
        key: pak-metadata-${{ runner.os }}-${{ runner.arch }}-${{ inputs.r-version }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        restore-keys: |
          pak-metadata-${{ runner.os }}-${{ runner.arch }}-${{ inputs.r-version }}-
